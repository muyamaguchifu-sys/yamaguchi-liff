<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <title>活動の記録</title>
</head>
<body>
  <div id="app">
    <div style="flex:1;display:flex;align-items:center;justify-content:center;color:#6b7280;font-family:sans-serif;height:100vh">読み込み中…</div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="sheet-root"></div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    // 画面のファイルは毎回最新を読み込む（スマホに古い画面が残らないように）
    (function () {
      var v = Date.now();
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'style.css?v=' + v;
      document.head.appendChild(css);
      var files = ['config.js', 'mock.js', 'app.js'];
      (function next(i) {
        if (i >= files.length) return;
        var s = document.createElement('script');
        s.src = files[i] + '?v=' + v;
        s.onload = function () { next(i + 1); };
        s.onerror = function () {
          document.getElementById('app').textContent = '読み込みに失敗しました。電波の良いところで開き直してください。';
        };
        document.body.appendChild(s);
      })(0);
    })();
  </script>
</body>
</html>
